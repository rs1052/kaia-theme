services:
  code-server:
    image: codercom/code-server:4.131.0
    entrypoint: ["/bin/sh", "/bootstrap/start-code-server.sh"]
    user: "0:0"
    environment:
      PASSWORD: ${KAIA_AUDIT_PASSWORD}
    ports:
      - "127.0.0.1:${KAIA_AUDIT_PORT:-8080}:8080"
    volumes:
      - profile:/home/coder/.local/share/code-server
      - extensions:/home/coder/.local/share/code-server/extensions
      - workspace:/workspace
      - ${KAIA_AUDIT_ROOT}/kaia-theme-vscode.vsix:/install/kaia-theme-vscode.vsix:ro
      - ${KAIA_AUDIT_ROOT}/tests/browser-audit/fixture:/fixture:ro
      - ${KAIA_AUDIT_ROOT}/tests/browser-audit/start-code-server.sh:/bootstrap/start-code-server.sh:ro

volumes:
  profile:
  extensions:
  workspace:
